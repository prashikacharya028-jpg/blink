html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
#view{flex:1;overflow-y:auto;position:relative}
h1{font-weight:800;font-size:28px;margin:0;letter-spacing:-.02em}
.hd{padding:18px 20px 8px}
.hd p{margin:2px 0 0;color:var(--mut);font-size:14px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 20px;text-align:left;border-bottom:1px solid var(--line)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none}
.row b{display:block;font-weight:800}
.row small{color:var(--mut);display:flex;align-items:center;gap:6px}
.sq{width:11px;height:11px;border-radius:3px;background:var(--acc);display:inline-block}
.sq.o{background:none;border:2px solid var(--mut)}
.new b{color:var(--acc)}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;padding:14px 0 12px;font-weight:800;color:var(--mut);font-size:14px}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.cam{position:absolute;inset:0;background:#0d0820;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .note{position:absolute;top:30%;padding:0 36px;text-align:center;opacity:.8}
.shut{position:relative;width:80px;height:80px;border-radius:50%;border:6px solid #fff;margin-bottom:28px;background:rgba(255,255,255,.15)}
.shut:active{transform:scale(.92)}
.sto{display:flex;gap:16px;overflow-x:auto;padding:8px 20px 16px}
.sto button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;flex:none}
.ring{padding:3px;border-radius:50%;background:var(--acc)}
.ring.v{background:var(--line)}
.ring .av{border:3px solid var(--bg);width:62px;height:62px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 20px}
.tile{aspect-ratio:3/4;border-radius:18px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff;text-align:left;font-weight:800;font-size:34px;line-height:1.1}
.tile span{font-size:14px}
.full{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.snap{background-size:cover;background-position:center;color:#fff;justify-content:center;align-items:center}
.snap .big{font-size:120px}
.snap .cap{position:absolute;left:0;right:0;top:55%;margin:0;padding:10px 16px;background:rgba(0,0,0,.55);text-align:center;font-size:20px}
.snap .who{position:absolute;bottom:24px;left:20px;font-weight:800;text-shadow:0 1px 4px #0008}
.bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;height:4px;background:#fff4;border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;background:#fff;transform-origin:left;animation:fill linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar b{animation-duration:1ms!important}}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.top b{font-weight:800;font-size:18px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;text-align:left}
.m.me{align-self:flex-end;background:var(--acc);border-color:var(--acc);color:#fff}
.m.sv{outline:2px solid #FFD23F}
.hint{text-align:center;color:var(--mut);font-size:13px}
.inp{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.btn{background:var(--acc);color:#fff;font-weight:800;padding:12px 18px;border-radius:14px}
.edit{color:#fff;justify-content:space-between}
.edit input{background:rgba(0,0,0,.55);border:0;color:#fff;text-align:center;font-size:20px;border-radius:0;width:100%;padding:12px;margin-top:40%}
.stk{position:absolute;left:0;right:0;top:25%;text-align:center;font-size:64px;pointer-events:none}
.tools{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000a);display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;align-items:center}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:#fff3;font-weight:800;font-size:14px}
.chip[aria-pressed="true"]{background:#fff;color:#1A1033}
.lay{position:absolute;inset:0;z-index:-1}.fr{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}.fr b{flex:1;font-weight:800}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:800;z-index:9;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav>
    <button data-tab="chat">Chats</button>
    <button data-tab="cam">Camera</button>
    <button data-tab="story">Stories</button>
  </nav>
</div>
<script>
const F=[{id:'maya',n:'Maya',c:'#FF4F81',e:'🌸'},{id:'dev',n:'Dev',c:'#3B5BFF',e:'🎧'},{id:'ines',n:'Ines',c:'#19C3B1',e:'🐙'},{id:'theo',n:'Theo',c:'#FF7A45',e:'🛹'},{id:'priya',n:'Priya',c:'#7B5BFF',e:'🍜'},{id:'noor',n:'Noor',c:'#E0A800',e:'🦊'},{id:'kai',n:'Kai',c:'#2E9E5B',e:'🏄'},{id:'zed',n:'Zed',c:'#C2410C',e:'🎮'}];
const G=['linear-gradient(160deg,#FF8A5B,#FF4F81)','linear-gradient(160deg,#19C3B1,#3B5BFF)','linear-gradient(160deg,#FFD23F,#FF7A45)','linear-gradient(160deg,#7B5BFF,#FF4F81)','linear-gradient(160deg,#1A1033,#19C3B1)'];
const STK=['😂','🔥','😎','💜','🎉','👀'];
const FLT=[['Normal',''],['Warm','sepia(.5) saturate(1.6)'],['Cool','hue-rotate(160deg) saturate(1.3)'],['Mono','grayscale(1) contrast(1.2)'],['Pop','saturate(2.4) contrast(1.2)'],['Fade','brightness(1.15) contrast(.8) saturate(.7)']];
const REP=['ha, same','send me the pic','omw','😂😂','wait what','lol ok'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fr=id=>F.find(f=>f.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={tab:'chat',stream:null,timer:null,
  snaps:[{from:'maya',bg:G[0],emoji:'🍕',cap:'dinner was worth it',secs:5,opened:false},{from:'ines',bg:G[1],emoji:'🌊',cap:'saturday plans?',secs:7,opened:false},{from:'theo',bg:G[2],emoji:'🛹',cap:'finally landed it',secs:4,opened:true}],
  stories:{maya:[{bg:G[3],emoji:'🌅',cap:'sunrise run'},{bg:G[0],emoji:'☕',cap:'second coffee'}],dev:[{bg:G[4],emoji:'🎧',cap:'new playlist is up'}],priya:[{bg:G[2],emoji:'🍜',cap:'ramen, again'},{bg:G[1],emoji:'🌧️',cap:'rain day'},{bg:G[3],emoji:'📚',cap:'library mode'}]},
  seen:{},sent:{},threads:{},draft:null,thread:null,added:['maya','dev','ines','theo','priya'],streak:{maya:12,dev:3},day:{}};
function save(){try{localStorage.setItem('blink',JSON.stringify({a:S.added,s:S.streak,d:S.day}))}catch(e){}}
try{const j=JSON.parse(localStorage.getItem('blink')||'null');if(j){S.added=j.a;S.streak=j.s;S.day=j.d}}catch(e){}
function addFriends(){const rest=F.filter(f=>!S.added.includes(f.id));ov(`<div class="top"><button data-act="x" aria-label="Back" class="chip" style="background:var(--line)">←</button><b>Add friends</b></div>`+(rest.length?rest.map(f=>`<div class="fr"><span class="av" style="background:${f.c}">${f.e}</span><b>${f.n}</b><button class="btn" data-addf="${f.id}">Add</button></div>`).join(''):`<p class="hint" style="padding:24px">Everyone is already in your chats.</p>`))}
const $=s=>document.querySelector(s);
const view=$('#view');

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#app').appendChild(d);setTimeout(()=>d.remove(),1800)}
function ov(html,cls=''){closeOv();const d=document.createElement('div');d.id='ov';d.className='full '+cls;d.innerHTML=html;$('#app').appendChild(d);return d}
function closeOv(){clearTimeout(S.timer);const o=$('#ov');if(o)o.remove()}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab));
  if(S.tab!=='cam')stopCam();
  if(S.tab==='chat')chatList();else if(S.tab==='story')storyList();else camView();
}
function chatList(){
  view.innerHTML=`<div class="hd" style="display:flex;justify-content:space-between;align-items:center"><div><h1>Chats</h1><p>Snaps vanish after you watch them.</p></div><button class="chip" data-act="addf" style="background:var(--acc);color:#fff">+ Add friends</button></div>`+F.filter(f=>S.added.includes(f.id)).map(f=>{
    const sn=S.snaps.find(s=>s.from===f.id&&!s.opened);
    const st=S.sent[f.id];
    const sub=sn?`<span class="sq"></span>New snap`:st?`<span class="sq o"></span>${st}`:`Tap to chat`;
    return `<button class="row ${sn?'new':''}" data-chat="${f.id}"><span class="av" style="background:${f.c}">${f.e}</span><span><b>${f.n}${S.streak[f.id]?' 🔥'+S.streak[f.id]:''}</b><small>${sub}</small></span></button>`}).join('');
}
function storyList(){
  const fs=F.filter(f=>S.stories[f.id]&&S.added.includes(f.id));
  view.innerHTML=`<div class="hd"><h1>Stories</h1></div><div class="sto">`+fs.map(f=>`<button data-story="${f.id}"><span class="ring ${S.seen[f.id]?'v':''}"><span class="av" style="background:${f.c}">${f.e}</span></span>${f.n}</button>`).join('')+`</div><div class="grid">`+fs.map(f=>{const s=S.stories[f.id][0];return `<button class="tile" data-story="${f.id}" style="background:${s.bg}">${s.emoji}<span>${f.n} · ${S.stories[f.id].length} ${S.stories[f.id].length>1?'moments':'moment'}</span></button>`}).join('')+`</div>`;
}
function camView(){
  view.innerHTML=`<div class="cam"><video id="vid" autoplay playsinline muted hidden></video><p class="note" id="note">Starting camera…</p><button class="shut" data-act="shoot" aria-label="Take snap"></button></div>`;
  startCam();
}
async function startCam(){
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    if(S.tab!=='cam'){stopCam();return}
    const v=$('#vid');v.srcObject=S.stream;v.hidden=false;$('#note').hidden=true;
  }catch(e){const n=$('#note');if(n)n.textContent='Camera isn’t available here. The shutter will make a sample snap instead.'}
}
function stopCam(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
function shoot(){
  const v=$('#vid');let img=null;
  if(v&&!v.hidden&&v.videoWidth){const c=document.createElement('canvas');c.width=360;c.height=Math.round(360*v.videoHeight/v.videoWidth);const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.7)}
  S.draft={img,bg:rnd(G),emoji:img?'':rnd(['🌈','🌆','🐶','🍩','🎸']),cap:'',secs:5,stk:'',to:[]};
  editView();
}
function bgOf(d){return d.img?`url(${d.img}) center/cover`:d.bg}
function editView(){
  const d=S.draft;
  ov(`<div class="snap edit" style="align-items:stretch"><div class="lay" style="background:${bgOf(d)};filter:${d.flt||'none'}"></div><div class="big" style="text-align:center;position:absolute;top:12%;left:0;right:0;font-size:96px">${d.emoji}</div><div class="stk">${d.stk}</div>
  <input type="text" id="cap" placeholder="Add a caption" value="${esc(d.cap)}" maxlength="60" aria-label="Caption">
  <div class="tools"><div class="chips" role="group" aria-label="Stickers">${STK.map(s=>`<button class="chip" data-stk="${s}">${s}</button>`).join('')}</div>
  <div class="chips" role="group" aria-label="Filters">${FLT.map(([n,v],i)=>`<button class="chip" data-flt="${i}" aria-pressed="${(d.flt||'')===v}">${n}</button>`).join('')}</div><div class="chips" role="group" aria-label="View time"><span>Viewable for</span>${[3,5,10].map(n=>`<button class="chip" data-secs="${n}" aria-pressed="${d.secs===n}">${n}s</button>`).join('')}</div>
  <div class="chips" role="group" aria-label="Send to">${F.map(f=>`<button class="chip" data-to="${f.id}" aria-pressed="${d.to.includes(f.id)}">${f.n}</button>`).join('')}</div>
  <div style="display:flex;gap:10px"><button class="chip" data-act="discard" style="flex:1;padding:12px">Discard</button><button class="btn" data-act="send" style="flex:2">Send snap</button></div></div></div>`);
  $('#cap').oninput=e=>{d.cap=e.target.value};
}
function viewSnap(s){
  const f=fr(s.from),ms=s.secs*1000;
  const o=ov(`<div class="snap" style="position:absolute;inset:0;display:flex" data-act="closesnap"><div class="lay" style="background:${bgOf(s)};filter:${s.flt||'none'}"></div><i class="bar"><b style="animation-duration:${ms}ms"></b></i><div class="big">${s.emoji||''}</div>${s.cap?`<p class="cap">${esc(s.cap)}</p>`:''}<span class="who">${f.n} · tap to close</span></div>`);
  S.cur=s;S.timer=setTimeout(()=>endSnap(),ms);
}
function endSnap(){if(S.cur){S.cur.opened=true;S.cur=null}closeOv();render()}
function viewStory(id){
  const sl=S.stories[id],f=fr(id);let i=0;
  const show=()=>{
    if(i>=sl.length){S.seen[id]=true;closeOv();render();return}
    const s=sl[i];
    ov(`<div class="snap" style="position:absolute;inset:0;background:${s.bg};display:flex" data-act="next"><i class="bar"><b style="animation-duration:4000ms"></b></i><div class="big">${s.emoji}</div><p class="cap">${esc(s.cap)}</p><span class="who">${f.n} · ${i+1}/${sl.length}</span></div>`);
    S.timer=setTimeout(()=>{i++;show()},4000);S.next=()=>{i++;show()};
  };show();
}
function openThread(id){
  S.thread=id;const f=fr(id);S.threads[id]=S.threads[id]||[];
  ov(`<div class="top"><button data-act="back" aria-label="Back" class="chip" style="background:var(--line)">←</button><span class="av" style="background:${f.c};width:36px;height:36px;font-size:18px">${f.e}</span><b>${f.n}</b></div><div class="msgs" id="msgs"></div><p class="hint">Messages clear when you leave. Tap one to save it.</p><div class="inp"><input type="text" id="mi" placeholder="Send a chat" aria-label="Message"><button class="btn" data-act="msg">Send</button></div>`);
  drawMsgs();$('#mi').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
}
function drawMsgs(){const el=$('#msgs');if(!el)return;const t=S.threads[S.thread];el.innerHTML=t.length?t.map((m,i)=>`<button class="m ${m.me?'me':''} ${m.sv?'sv':''}" data-save="${i}">${esc(m.t)}</button>`).join(''):`<p class="hint">Say hi to ${fr(S.thread).n}.</p>`;el.scrollTop=1e9}
function sendMsg(){
  const i=$('#mi'),t=i.value.trim();if(!t)return;const id=S.thread;
  S.threads[id].push({me:1,t});i.value='';drawMsgs();
  setTimeout(()=>{if(S.thread===id){S.threads[id].push({t:rnd(REP)});drawMsgs()}},1200);
}
function sendSnap(){
  const d=S.draft;if(!d.to.length){toast('Pick who to send to');return}
  d.to.forEach(id=>{const day=new Date().toDateString();if(S.day[id]!==day){S.day[id]=day;S.streak[id]=(S.streak[id]||0)+1}save();S.sent[id]='Delivered';setTimeout(()=>{S.sent[id]='Opened';if(S.tab==='chat'&&!$('#ov'))chatList()},2500+Math.random()*2500)});
  toast('Sent to '+d.to.map(id=>fr(id).n).join(', '));S.draft=null;closeOv();S.tab='chat';render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act]');if(!t)return;const d=t.dataset;
  if(d.tab){S.tab=d.tab;render();return}
  if(d.chat){const s=S.snaps.find(x=>x.from===d.chat&&!x.opened);s?viewSnap(s):openThread(d.chat);return}
  if(d.story){viewStory(d.story);return}
  if(d.flt!==undefined){S.draft.flt=FLT[+d.flt][1];editView();return}if(d.addf){S.added.push(d.addf);save();addFriends();return}if(d.stk!==undefined){S.draft.stk+=d.stk;editView();return}
  if(d.secs){S.draft.secs=+d.secs;editView();return}
  if(d.to){const a=S.draft.to,i=a.indexOf(d.to);i<0?a.push(d.to):a.splice(i,1);editView();return}
  if(d.save!==undefined){const m=S.threads[S.thread][+d.save];m.sv=!m.sv;drawMsgs();return}
  switch(d.act){
    case'shoot':shoot();break;
    case'addf':addFriends();break;
    case'x':closeOv();render();break;
    case'discard':S.draft=null;closeOv();break;
    case'send':sendSnap();break;
    case'closesnap':endSnap();break;
    case'next':clearTimeout(S.timer);S.next();break;
    case'msg':sendMsg();break;
    case'back':S.threads[S.thread]=S.threads[S.thread].filter(m=>m.sv);S.thread=null;closeOv();render();break;
  }
});
setInterval(()=>{const c=S.added.filter(id=>!S.snaps.some(s=>s.from===id&&!s.opened));if(!c.length)return;const id=rnd(c);S.snaps.push({from:id,bg:rnd(G),emoji:rnd(['🍔','🌴','🐱','🎬','🚲','🌙']),cap:rnd(['look at this','guess where I am','no context','you had to be there']),secs:5,opened:false,flt:rnd(FLT)[1]});toast('New snap from '+fr(id).n);if(S.tab==='chat'&&!$('#ov'))chatList()},20000);
render();
</script>
</body>
</html>
